name: efcore-extensions-integration

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "EfCoreExtensions_2026!"
    ports:
      - "14333:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
