version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    groups:
      entity-framework-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.Testing*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Amsterdam
    groups:
      github-actions:
        patterns:
          - "*"
